<script>
/* Tema claro/oscuro/auto, como en Tiqet: la clase `dark` en <html> se pone antes del primer pintado para evitar el destello.
   La preferencia vive en localStorage ('light' | 'dark'; ausente = auto, sigue al sistema). */
(function () {
  var KEY = 'frameart-theme', media = window.matchMedia('(prefers-color-scheme: dark)');
  function stored() { try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'auto' } catch (e) { return 'auto' } }
  function apply() { var m = stored(); document.documentElement.classList.toggle('dark', m === 'dark' || (m === 'auto' && media.matches)) }
  apply();
  if (media.addEventListener) media.addEventListener('change', apply);
  window.frameTheme = { get: stored, set: function (m) { try { m === 'auto' ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, m) } catch (e) {} apply() } };
})();
</script>
<style>
:root{color-scheme:light;--bg:#fafafa;--surface:#fff;--surface2:#f4f4f5;--border:#e4e4e7;--text:#18181b;--muted:#71717a;--accent:#4f46e5;
 --btn:#18181b;--btn-text:#fff;--ok-bg:#ecfdf5;--ok-bd:#a7f3d0;--ok-fg:#065f46;--warn-bg:#fffbeb;--warn-bd:#fde68a;--warn-fg:#92400e;
 --err-bg:#fff1f2;--err-bd:#fecdd3;--err-fg:#9f1239;--shadow:0 8px 24px rgba(0,0,0,.12);--ease:cubic-bezier(.32,.72,0,1)}
html.dark{color-scheme:dark;--bg:#09090b;--surface:#18181b;--surface2:#27272a;--border:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--accent:#818cf8;
 --btn:#f4f4f5;--btn-text:#18181b;--ok-bg:#18181b;--ok-bd:rgba(16,185,129,.25);--ok-fg:#34d399;--warn-bg:#18181b;--warn-bd:rgba(245,158,11,.25);--warn-fg:#fbbf24;
 --err-bg:#18181b;--err-bd:rgba(244,63,94,.3);--err-fg:#fb7185;--shadow:0 8px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h1{font-size:1.15rem;margin:0}h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.muted{color:var(--muted);font-size:.86em}p.muted{margin:8px 0}
a{color:var(--accent)}

header.top{flex:none;background:var(--bg);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}

.theme button.on{background:var(--surface2);color:var(--text)}.theme svg{width:16px;height:16px}
.tabs{display:flex;gap:4px;margin-top:6px;position:relative}
.tabs button{background:none;color:var(--muted);border:0;border-radius:0;padding:10px 14px;font-weight:600;transition:color .2s}

.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.panel>.wrap{padding-top:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom))}   /* el final queda por encima de las notificaciones */
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:10px;padding:9px 16px;background:var(--btn);color:var(--btn-text);font-weight:600}
button.sec{background:var(--surface);color:var(--text);border-color:var(--border)}button.sec:hover{background:var(--surface2)}
button:disabled{opacity:.5;cursor:default}button.sm{padding:6px 12px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin:10px 0}
/* Acordeón: una sección abierta a la vez; la cabecera resume el estado sin abrirla */
.acc{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:8px 0;overflow:hidden}
.acc .acc{border-radius:10px;background:var(--bg);margin:8px 0}

.acc.open>.acc-b{grid-template-rows:1fr}
.sub{margin:16px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.noanim .acc-b,.noanim .chev{transition:none!important}

.f{display:flex;flex-direction:column;gap:4px;margin:12px 0}.f .lt{font-weight:600;font-size:.88em}

.c{display:flex;gap:10px;align-items:center;margin:10px 0;cursor:pointer}
#pv{width:100%;border-radius:12px;background:var(--surface2);aspect-ratio:16/9;object-fit:contain;display:block;border:1px solid var(--border)}
#st{margin:10px 0;min-height:1.4em;color:var(--muted)}#st.warn{color:var(--warn-fg)}#st.error{color:var(--err-fg)}

.item{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;font-size:.85em}

.ic.fill{fill:currentColor}button>.ic{margin-right:6px}button.icon>.ic,.tabs button>.ic,.theme button>.ic,.toast button>.ic{margin-right:0}

.acc.open>.acc-h .chip{color:var(--bg);background:var(--btn)}
.acc .acc .acc-h .ic.kind{color:var(--muted)}
.tabs button{display:flex;align-items:center;gap:6px}.tabs button .ic{margin:0}
#st{display:flex;gap:8px;align-items:flex-start}#st .ic{margin-top:2px}#st.ok .ic{color:var(--ok-fg)}
.warn-line{display:flex;gap:8px;align-items:flex-start}.warn-line .ic{margin-top:2px}
.toast .ic{margin-top:1px}.toast button .ic{margin:0}
/* Tirar para actualizar (el del navegador no existe: la página no se desplaza, cada panel sí) */
#ptr{position:fixed;left:50%;top:calc(var(--hdr,100px) + 10px);width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow);display:grid;place-items:center;z-index:15;opacity:0;transform:translateY(-60px);pointer-events:none}
#ptr.anim{transition:transform .25s var(--ease),opacity .25s}#ptr .ic{width:20px;height:20px;margin:0}
#ptr.spin .ic{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ptr.spin .ic{animation:none}}
.perr{color:var(--err-fg);font-size:.88em;margin:6px 0}
/* La barra de guardado va dentro del flujo (no flota): el contenido se acorta en vez de quedar tapado */
#savebar{flex:none;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
#savebar .wrap{display:flex;gap:10px;align-items:center}#savebar .msg{flex:1;font-weight:600;min-width:0;white-space:nowrap}#savebar .short{display:none}

.toast-stack{position:fixed;left:16px;right:16px;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
 bottom:calc(16px + var(--keyboard-inset,0px) + var(--bar-h,0px))}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:8px;width:100%;max-width:24rem;border:1px solid;border-radius:12px;padding:12px 16px;font-size:.92em;box-shadow:var(--shadow);animation:toast-in .2s ease-out}
.toast.out{animation:toast-out .2s ease-in forwards}
.toast-success{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-fg)}
.toast-warning{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-fg)}
.toast-error{background:var(--err-bg);border-color:var(--err-bd);color:var(--err-fg)}

.toast button:hover,.toast button:focus-visible{opacity:1}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(16px)}}

 .f .ctl select,.f .ctl input:not([type=checkbox]){max-width:none}.cat{flex-direction:column}.cat button{width:100%}
 #savebar .long{display:none}#savebar .short{display:inline}#savebar button{padding-left:12px;padding-right:12px}
}
</style>

function notify(text,variant='success',ms=5000){

async function api(url,o){const r=await fetch(url,o);let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||r.statusText);return j}

/* ───── tema ───── */
function paintTheme(){const m=frameTheme.get();$$('#theme button').forEach(b=>{b.classList.toggle('on',b.dataset.m==m);b.setAttribute('aria-pressed',b.dataset.m==m)})}
$('theme').onclick=e=>{const b=e.target.closest('button');if(b){frameTheme.set(b.dataset.m);paintTheme()}};paintTheme();

function slide(p){ // el indicador sigue al dedo, interpolando entre pestañas
 if(!rects.length)return;const i=Math.max(0,Math.min(rects.length-1,Math.floor(p))),j=Math.min(rects.length-1,i+1),t=Math.max(0,Math.min(1,p-i));
 const x=rects[i].x+(rects[j].x-rects[i].x)*t,w=rects[i].w+(rects[j].w-rects[i].w)*t;ind.style.transform=`translateX(${x}px) scaleX(${w/10})`}
function goTab(i,smooth=true){pager.scrollTo({left:i*pager.clientWidth,behavior:smooth&&!reduce?'smooth':'auto'})}
function setTab(i){if(i===tab&&pager.dataset.ready)return;tab=i;pager.dataset.ready=1;
 $$('#tabs [data-tab]').forEach((b,k)=>{b.setAttribute('aria-selected',k==i);b.tabIndex=k==i?0:-1});
 $$('.panel').forEach((p,k)=>p.inert=k!=i);   // lo que no se ve no recibe foco ni toques
 if(location.hash!='#'+TABS[i])history.replaceState(null,'','#'+TABS[i]);barState()}
pager.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const p=pager.scrollLeft/(pager.clientWidth||1);slide(p);const i=Math.round(p);if(i!==tab)setTab(i)})},{passive:true});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)goTab(+b.dataset.tab)});
$('tabs').addEventListener('keydown',e=>{const d={ArrowRight:1,ArrowLeft:-1}[e.key];if(d){const i=Math.max(0,Math.min(2,tab+d));goTab(i);$$('#tabs [data-tab]')[i].focus();e.preventDefault()}});
addEventListener('resize',()=>{hdr();measure();goTab(tab,false);slide(tab)});

/* ───── tirar hacia abajo para actualizar (en cualquier pestaña, estando arriba del todo) ───── */
const ptr=$('ptr');let pull=null,refreshing=false;ptr.innerHTML=ic('refresh');
const hdr=()=>document.documentElement.style.setProperty('--hdr',document.querySelector('header.top').offsetHeight+'px');
function ptrSet(d,anim){ptr.classList.toggle('anim',!!anim);ptr.style.opacity=Math.min(1,d/50);ptr.style.transform=`translateY(${d-60}px) rotate(${d*4}deg)`}
async function refreshAll(){if(refreshing)return;refreshing=true;ptr.classList.add('spin');ptrSet(60,true);
 try{await Promise.all([poll(),loadLib(),dirty?null:load()]);$('pv').src='preview.jpg?'+Date.now();notify(dirty?'Estado actualizado (tus cambios sin guardar se conservan)':'Actualizado','success',2500)}
 catch(e){fail(e)}finally{refreshing=false;ptr.classList.remove('spin');ptrSet(0,true)}}
pager.addEventListener('touchstart',e=>{const p=e.target.closest('.panel');pull=p&&p.scrollTop<=0&&e.touches.length==1&&!refreshing?{p,x:e.touches[0].clientX,y:e.touches[0].clientY,d:0,on:false}:null},{passive:true});
pager.addEventListener('touchmove',e=>{if(!pull)return;const t=e.touches[0],dy=t.clientY-pull.y,dx=t.clientX-pull.x;
 if(!pull.on){if(dy<-6||Math.abs(dx)>Math.abs(dy)+4){pull=null;return}if(dy<10)return;pull.on=true}
 if(pull.p.scrollTop>0){pull=null;ptrSet(0,true);return}
 pull.d=Math.min(96,dy*.5);ptrSet(pull.d)},{passive:true});
pager.addEventListener('touchend',()=>{if(!pull)return;const d=pull.d;pull=null;d>=48?refreshAll():ptrSet(0,true)});
pager.addEventListener('touchcancel',()=>{pull=null;ptrSet(0,true)});

/* ───── cambios sin guardar ───── */
function setDirty(v){dirty=v;barState()}
function barState(){const on=dirty&&tab==1;$('savebar').hidden=!on;document.documentElement.style.setProperty('--bar-h',on?$('savebar').offsetHeight+'px':'0px')}
$('settings').addEventListener('input',e=>{setDirty(true);summaries()});$('settings').addEventListener('change',()=>{setDirty(true);summaries()});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const okToLose=()=>!dirty||confirm('Tienes cambios sin guardar en Ajustes; se perderán. ¿Continuar?');

/* ───── acordeón: una sección abierta a la vez por grupo; la cabecera resume el estado ───── */
const ACC=(g,id,title,sub,body,open,icon)=>`<div class="acc${open?' open':''}" data-g="${g}"><div class="acc-h" role="button" tabindex="0" aria-expanded="${!!open}" aria-controls="b-${id}">${icon?`<span class="chip">${ic(icon)}</span>`:''}<span class="acc-t">${title}</span><span class="acc-s" id="s-${id}">${sub||''}</span><i class="chev"></i></div><div class="acc-b" id="b-${id}"><div class="acc-in"><div class="acc-body">${body}</div></div></div></div>`;
function setAcc(a,open){a.classList.toggle('open',open);a.querySelector(':scope>.acc-h').setAttribute('aria-expanded',open)}
function toggleAcc(a){const open=!a.classList.contains('open');
 if(open)$$(`.acc[data-g="${a.dataset.g}"]`).forEach(o=>o!==a&&setAcc(o,false));setAcc(a,open);
 if(open)setTimeout(()=>a.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'}),320)}
document.addEventListener('click',e=>{const h=e.target.closest('.acc-h');if(h&&!e.target.closest('input,select,button,a,label'))toggleAcc(h.parentElement)});
document.addEventListener('keydown',e=>{const h=e.target.closest?.('.acc-h');if(h&&e.target===h&&(e.key=='Enter'||e.key==' ')){e.preventDefault();toggleAcc(h.parentElement)}});

/* ───── formulario generado desde los ajustes que declara cada plugin ───── */
function field(p,f,vals,isSet){const id=`f-${p.id}-${f.key}`,v=vals[f.key],a=`data-p="${p.id}" data-k="${f.key}" data-t="${f.type}"`,ph=esc(f.placeholder||'');
 const wrap=(ctl)=>`<div class="f"><label class="lt" for="${id}">${esc(f.label)}</label><div class="ctl">${ctl}</div></div>`;
 switch(f.type){
 case 'hidden':return `<input type="hidden" ${a} value="${esc(v)}">`;
 case 'bool':return `<label class="c"><input type="checkbox" id="${id}" ${a} ${v?'checked':''}> ${esc(f.label)}</label>`;
 case 'number':return wrap(`<input type="number" id="${id}" ${a} value="${esc(v)}" min="${f.min??''}" max="${f.max??''}" step="${f.step??'any'}" style="max-width:8rem">`);
 case 'password':return wrap(`<input type="password" id="${id}" ${a} autocomplete="off" placeholder="${isSet[f.key]?'(guardada)':'(sin configurar)'}">`);
 case 'select':{const stat=(f.choices||[]).map(c=>`<option value="${esc(c[0])}">${esc(c[1])}</option>`).join('')+(f.choices_from&&v?`<option value="${esc(v)}" selected>${esc(v)}</option>`:'');
  return wrap(`<select id="${id}" ${a} data-from="${f.choices_from||''}"><option value="">${esc(f.empty||'Cualquiera')}</option>${stat}</select>${f.choices_from?`<button type="button" class="sec sm icon" data-reload="${p.id}|${f.key}" title="Actualizar opciones" aria-label="Actualizar opciones">${ic('refresh')}</button>`:''}`)}
 case 'location':return wrap(`<input id="${id}" ${a} value="${esc(v)}" placeholder="${ph}"><button class="sec sm" type="button" data-geo="${p.id}">${ic('pin')}Usar mi ubicación</button>`);
 default:return wrap(`<input id="${id}" ${a} value="${esc(v)}" placeholder="${ph}" autocomplete="off">`)}}
function pluginRow(g,p,vals,radio){const set=vals._set||{},c=radio?`<input type="radio" name="layout" value="${p.id}" ${CFG.layout==p.id?'checked':''} aria-label="Usar ${esc(p.label)}">`
 :`<input type="checkbox" data-p="${p.id}" data-k="enabled" data-t="bool" ${vals.enabled?'checked':''} aria-label="Activar ${esc(p.label)}">`;
 const body=(p.description?`<p class="muted">${esc(p.description)}</p>`:'')+p.settings.map(f=>field(p,f,vals,set)).join('');
 return `<div class="acc" data-g="${g}"><div class="acc-h" role="button" tabindex="0" aria-expanded="false" aria-controls="b-${p.id}">${c}${ic(KIND_IC[p.kind],'kind')}<span class="acc-t"><b>${esc(p.label)}</b></span><i class="chev" style="margin-left:auto"></i></div><div class="acc-b" id="b-${p.id}"><div class="acc-in"><div class="acc-body">${body}</div></div></div></div>`}
const plug=kind=>SCHEMA.plugins.filter(p=>p.kind==kind);
const on=id=>{const e=document.querySelector(`#settings [data-p="${id}"][data-k="enabled"]`);return e?e.checked:false};
const names=kind=>plug(kind).filter(p=>on(p.id)).map(p=>p.label).join(' · ')||'ninguna';
function summaries(){const set=(id,t)=>{const e=$('s-'+id);if(e)e.textContent=t};
 set('display',names('display'));set('source',names('source')+($('only_favorites')?.checked?' · solo favoritas':''));
 const lay=document.querySelector('#settings input[name=layout]:checked');set('layout',lay?SCHEMA.plugins.find(p=>p.id==lay.value).label:'ninguna');
 set('matte',($('matte')?.checked?`${$('matte_color').value} · ${$('margin').value} px`:'sin paspartú')+(names('band')!='ninguna'?' · '+names('band'):''));
 set('lang',`${$('language').value||'es'} · ${names('translator')}`);
 set('rot',`cada ${$('interval_hours').value} h`);if($('mv'))$('mv').textContent=$('margin').value}
function build(){
 const openIds=$$('.acc.open').map(a=>a.querySelector(':scope>.acc-b').id);   // al reconstruir (descartar, guardar, instalar…) se conserva qué secciones estaban abiertas
 const empty='<div class="muted" style="padding:10px 0">Ninguno instalado; instálalo desde la pestaña Plugins.</div>';
 const rows=(kind,g,radio)=>plug(kind).map(p=>pluginRow(g,p,CFG.plugins[p.id]||{},radio)).join('')||empty;
 $('settings').innerHTML=
  ACC('s','display','Pantallas','',rows('display','pd'),0,'monitor')+
  ACC('s','source','Fuentes de imágenes','',rows('source','ps')+'<label class="c"><input type="checkbox" id="only_favorites"> Elegir al azar solo entre mis favoritas</label>',0,'image')+
  ACC('s','layout','Disposición','',rows('layout','pl',true),0,'layout')+
  ACC('s','matte','Paspartú y franjas','',`<label class="c"><input type="checkbox" id="matte"> Usar paspartú</label>
   <div class="f"><span class="lt">Color</span><div class="ctl"><select id="matte_color">${SCHEMA.mattes.map(m=>`<option>${m}</option>`).join('')}</select></div></div>
   <div class="f"><span class="lt">Margen: <span id="mv"></span> px</span><div class="ctl"><input type="range" id="margin" min="0" max="400" step="10"></div></div>
   <div class="muted">El paspartú es igual por los cuatro lados. Las franjas de arriba y abajo (más abajo) viven dentro del paspartú y piden un margen mínimo de 150 px.</div>
   <h4 class="sub">Franjas sobre el paspartú</h4>${rows('band','pb')}`,0,'frame')+
  ACC('s','lang','Traducción','',`<div class="f"><label class="lt" for="language">Idioma de las fichas</label><div class="ctl"><input id="language" size="4" maxlength="8" placeholder="es" style="max-width:8rem"></div></div>`+rows('translator','pt'),0,'languages')+
  ACC('s','rot','Rotación','',`<div class="f"><label class="lt" for="interval_hours">Cambiar la imagen cada (horas)</label><div class="ctl"><input type="number" id="interval_hours" min="0.25" max="168" step="0.25" style="max-width:8rem"></div></div>`,0,'clock');
 ['matte','only_favorites'].forEach(k=>$(k).checked=CFG[k]);['matte_color','language','margin','interval_hours'].forEach(k=>$(k).value=CFG[k]);
 const KIND_G=[['display','Pantallas'],['source','Fuentes de imágenes'],['layout','Disposiciones'],['band','Franjas'],['translator','Traductores']];
 $('catalog').innerHTML=KIND_G.map(([kind,title])=>{const items=SCHEMA.catalog.filter(m=>m.kind==kind);if(!items.length)return'';
  const n=items.filter(m=>m.installed).length;
  return ACC('c','c-'+kind,title,`${n} de ${items.length} instalados`,items.map(m=>`<div class="cat"><div class="i"><b>${esc(m.label)}</b>${m.installed?'<span class="k">instalado</span>':''}
   <div class="muted">${esc(m.description)}</div>${m.terms?`<div class="muted">${ic('info')} ${esc(m.terms)}</div>`:''}
   <div class="muted">${esc(m.author)}${m.license?' · '+esc(m.license):''}${m.requires.length?' · instala: '+esc(m.requires.join(', ')):''}</div></div>
   <button type="button" class="${m.installed?'sec':''}" data-cat="${m.name}" data-on="${!m.installed}">${m.installed?ic('trash')+'Quitar':ic('download')+'Instalar'}</button></div>`).join(''),0,KIND_IC[kind])}).join('');
 $('perrs').innerHTML=SCHEMA.errors.map(e=>`<div class="perr">${ic('alert')} ${esc(e.origin)}: ${esc(e.error)}</div>`).join('');
 document.documentElement.classList.add('noanim');   // se restauran abiertas sin animar para que no parpadee
 openIds.forEach(id=>{const a=document.getElementById(id)?.parentElement;if(a)setAcc(a,true)});
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('noanim')));
 $$('select[data-from]').forEach(s=>{if(s.dataset.from)loadChoices(s.dataset.p,s.dataset.k,true)});summaries();setDirty(false)}
async function loadChoices(pid,key,quiet){const s=document.querySelector(`select[data-p="${pid}"][data-k="${key}"]`),f=SCHEMA.plugins.find(p=>p.id==pid).settings.find(x=>x.key==key);
 if(!(CFG.plugins[pid]||{}).enabled&&quiet)return;
 try{const o=await api(`api/plugins/${pid}/choices/${f.choices_from}`);const cur=s.value;
  s.innerHTML=`<option value="">${esc(f.empty||'Cualquiera')}</option>`+o.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');s.value=cur}catch(e){if(!quiet)fail(e)}}
function collect(only){const body={core:{},plugins:{}};
 if(!only){['matte','only_favorites'].forEach(k=>body.core[k]=$(k).checked);['matte_color','language','margin','interval_hours'].forEach(k=>body.core[k]=$(k).value);
  const lay=document.querySelector('#settings input[name=layout]:checked');if(lay)body.core.layout=lay.value}
 $$('#settings [data-p]').forEach(e=>{if(e.dataset.reload||e.dataset.geo||(only&&e.dataset.p!=only))return;const o=body.plugins[e.dataset.p]??={};o[e.dataset.k]=e.type=='checkbox'?e.checked:e.value});return body}
async function load(){[SCHEMA,CFG]=await Promise.all([api('api/plugins'),api('api/settings')]);build()}

/* ───── acciones: se avisa con una notificación cuando termina la operación en la TV ───── */
async function settle(label){
 for(let i=0;i<150;i++){await new Promise(r=>setTimeout(r,800));const s=await api('api/status');paint(s);
  if(!s.busy&&s.updated!==lastUpdated){(s.warnings||[]).forEach(w=>notify(w,'warning',8000));
   notify(s.level=='error'?s.message:(label||'Listo')+(s.title?': '+s.title:''),s.level=='error'?'error':'success',s.level=='error'?8000:5000);
   $('pv').src='preview.jpg?'+Date.now();loadLib();return}}}
async function act(url,body,label){try{lastUpdated=(await api('api/status')).updated;const r=await api(url,{method:'POST',body:JSON.stringify(body||{})});
 if(r.started===false&&!body?.noapply)notify('Ya hay una operación en curso; espera a que termine.','warning');else if(r.started)await settle(label);return r}catch(e){fail(e)}}
$('chg').onclick=()=>act('api/change',{},'Imagen nueva');
$('save').onclick=async()=>{const r=await act('api/settings',collect(),'Ajustes aplicados');if(r){await load()}};
$('discard').onclick=()=>{build();notify('Cambios descartados','warning',3000)};
$('reload').onclick=async()=>{if(!okToLose())return;try{await api('api/plugins/reload',{method:'POST'});await load();notify('Plugins recargados')}catch(e){fail(e)}};
document.addEventListener('input',e=>{if(e.target.id=='margin')$('mv').textContent=e.target.value});
document.addEventListener('click',async e=>{
 const c=e.target.closest('[data-cat]');if(c){if(!okToLose())return;c.disabled=true;const on=c.dataset.on=='true',name=SCHEMA.catalog.find(m=>m.name==c.dataset.cat).label;
  try{await api('api/catalog/'+(on?'install':'uninstall'),{method:'POST',body:JSON.stringify({name:c.dataset.cat})});await load();notify(`«${name}» ${on?'instalado':'quitado'}`)}catch(x){fail(x);c.disabled=false}return}
 const r=e.target.closest('[data-reload]');if(r){const [pid,key]=r.dataset.reload.split('|');
  try{await api('api/settings',{method:'POST',body:JSON.stringify({noapply:true,plugins:collect(pid).plugins})});CFG=await api('api/settings')}catch(x){fail(x);return}
  await loadChoices(pid,key,false);return}
 const g=e.target.closest('[data-geo]');if(g){const pid=g.dataset.geo;
  if(!navigator.geolocation){notify('El navegador no permite ubicación en http; escribe tu ciudad.','warning');return}
  navigator.geolocation.getCurrentPosition(async p=>{const b=collect(pid);b.plugins[pid]={...b.plugins[pid],geo:true,lat:p.coords.latitude,lon:p.coords.longitude};await act('api/settings',b,'Ubicación actualizada');await load()},x=>fail(new Error('No se pudo obtener la ubicación: '+x.message)))}});

/* ───── estado y biblioteca ───── */
function paint(s){$('st').className=s.level;$('st').innerHTML=ic({ok:'checkcircle',warn:'alert',error:'xcircle'}[s.level]||'info')+'<span>'+esc((s.title?s.title+' · ':'')+s.message+(s.updated?' ('+s.updated+')':''))+'</span>';
 $('warn').innerHTML=(s.warnings||[]).map(w=>'<div class="warn-line">'+ic('alert')+'<span>'+esc(w)+'</span></div>').join('');$('chg').disabled=$('save').disabled=s.busy}
async function poll(){try{paint(await api('api/status'))}catch(e){}}
async function loadLib(){const l=await api('api/library'),items=l[lib];
 $('libhint').textContent=items.length?'':{history:'Aún no hay obras.',favorites:'Marca ⭐ en una obra para guardarla.',blocked:'Ninguna obra oculta.'}[lib];
 $('grid').innerHTML=items.map(i=>`<div class="item ${i.current?'cur':''}"><img src="thumb/${i.thumb}" loading="lazy" alt=""><div class="t" title="${esc(i.title)}">${esc(i.title)}</div><div class="b">
  <button type="button" class="icon" data-a="show" data-id="${i.id}" title="Mostrar en la pantalla" aria-label="Mostrar en la pantalla">${ic('play')}</button>
  <button type="button" class="icon" data-a="fav" data-id="${i.id}" data-on="${!i.favorite}" title="Favorita" aria-label="Favorita">${ic('star',i.favorite?'fill':'')}</button>
  <button type="button" class="icon" data-a="blk" data-id="${i.id}" data-on="${!i.blocked}" title="${i.blocked?'Restaurar':'No mostrar más'}" aria-label="${i.blocked?'Restaurar':'No mostrar más'}">${ic(i.blocked?'undo':'ban')}</button></div></div>`).join('')}
$('grid').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,on=b.dataset.on=='true';
 if(b.dataset.a=='show'){act('api/show',{id},'Mostrando');return}
 try{await api(b.dataset.a=='fav'?'api/favorite':'api/block',{method:'POST',body:JSON.stringify({id,on})});notify(b.dataset.a=='fav'?(on?'Añadida a favoritas':'Quitada de favoritas'):(on?'Obra oculta: no volverá a salir':'Obra restaurada'),'success',3000);loadLib()}catch(x){fail(x)}};
$$('#libtabs button').forEach(b=>b.onclick=()=>{lib=b.dataset.t;$$('#libtabs button').forEach(x=>x.classList.toggle('on',x==b));loadLib()});

hdr();decorate();measure();setTab(Math.max(0,TABS.indexOf(location.hash.slice(1))));requestAnimationFrame(()=>{goTab(tab,false);slide(tab)});
load().catch(fail);loadLib();$('pv').src='preview.jpg';setInterval(poll,4000);poll();
</script></html>
